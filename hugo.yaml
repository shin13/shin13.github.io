# Configuration
baseURL: https://shin13.github.io/
locale: en-US
title: Shin Li
copyright: "© Shin Li"

author:
  name: Shin Li
  email: soobahorn@gmail.com

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: false

services:
  googleAnalytics:
    ID: G-WMZ3MVZ541

outputs:
  home: [HTML, RSS, JSON]
  page: [HTML]
  section: [HTML, RSS]

defaultContentLanguage: en
languages:
  en:
    label: English
    weight: 1
    title: Shin Li
  # Temporarily disabled until Traditional Chinese pages are ready.
  # zh-tw:
  #   label: 繁體中文
  #   locale: zh-TW
  #   weight: 2
  #   title: 李芯

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: false
    style: github

enableInlineShortcodes: true

menu:
  main:
    - identifier: now
      name: Now
      pageRef: /now
      weight: 1
    - identifier: notes
      name: Notes
      pageRef: /notes
      weight: 2
    - identifier: projects
      name: Projects
      pageRef: /projects
      weight: 3
    - identifier: about
      name: About
      pageRef: /about
      weight: 4
    - identifier: search
      name: Search
      pageRef: /search
      weight: 5
    - identifier: github
      name: GitHub
      url: "https://github.com/shin13"
      weight: 6

params:
  env: production
  author: Shin Li
  description: "Shin Li's personal home on the internet — notes, projects, and current focus across clinical pharmacy, AI systems, research, teaching, and personal knowledge work."
  keywords: [Shin Li, clinical pharmacy, healthcare AI, RAG, medical AI, personal knowledge management]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  hideFooter: false
  comments: false

  profileMode:
    enabled: true
    title: "Hi, I’m Shin."
    subtitle: "I work between clinical pharmacy, AI systems, research, teaching, and personal knowledge work."
    buttons:
      - name: Now
        url: now/
      - name: Notes
        url: notes/
      - name: Projects
        url: projects/

  socialIcons:
    - name: github
      url: "https://github.com/shin13"

  assets:
    disableHLJS: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

taxonomies:
  category: categories
  tag: tags
