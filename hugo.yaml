# Configuration
baseURL: https://shin13.github.io/
locale: en-US
title: Shin Li

author:
  name: Shin Li
  email: soobahorn@gmail.com

enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: false

services:
  googleAnalytics:
    ID: G-WMZ3MVZ541

outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]

defaultContentLanguage: en
languages:
  en:
    label: English
    weight: 1
    title: Shin Li
  # Temporarily disabled until Traditional Chinese pages are ready.
  # zh-tw:
  #   label: 繁體中文
  #   locale: zh-TW
  #   weight: 2
  #   title: 李芯
  # zh-cn:
  #   label: 简体中文
  #   locale: zh-CN
  #   weight: 3
  #   title: 李芯

module:
  # hugoVersion:
  #   extended: true
  #   min: "0.112.0"

  # workspace: hugo.work
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

enableInlineShortcodes: true

menu:
  main:
    - identifier: now
      name: Now
      pageRef: /now
      weight: 1
    - identifier: notes
      name: Notes
      pageRef: /notes
      weight: 2
    - identifier: project
      name: Projects
      pageRef: /projects
      weight: 3
    - identifier: about
      name: About
      pageRef: /about
      weight: 4
    # - identifier: documentation
    #   name: Documentation
    #   pageRef: /docs
    #   weight: 5
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/shin13"
      params:
        icon: github

  sidebar:
    - identifier: more
      name: More
      params:
        type: separator
      weight: 1
    - identifier: now
      name: "Now"
      pageRef: "/now"
      weight: 2
    - identifier: notes
      name: "Notes"
      pageRef: "/notes"
      weight: 3
    - identifier: projects
      name: "Projects"
      pageRef: "/projects"
      weight: 4
    - identifier: about
      name: "About"
      pageRef: "/about"
      weight: 5

params:
  author:
    name: Shin Li
    email: soobahorn@gmail.com
#   description: Modern, responsive, batteries-included Hugo theme for creating beautiful static websites.

  navbar:
    displayTitle: true
    displayLogo: false
    # logo:
    #   path: images/logo.svg
    #   dark: images/logo-dark.svg
    #   # width: 40
    #   # height: 20
    #   # link: /
    width: wide

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: normal

  theme:
    # light | dark | system
    default: light
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  # Search
  # flexsearch is enabled by default
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: forward

  editURL:
    enable: true
    base: "https://github.com/shin13/shin13.github.io/edit/main/content"

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  comments:
    enable: false
    type: giscus

    # https://giscus.app/
    giscus:
      repo: imfing/hextra
      repoId: R_kgDOJ9fJag
      category: General
      categoryId: DIC_kwDOJ9fJas4CY7gW
      # mapping: pathname
      # strict: 0
      # reactionsEnabled: 1
      # emitMetadata: 0
      # inputPosition: top
      # lang: en
