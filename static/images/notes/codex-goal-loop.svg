<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Codex /goal loop</title>
  <desc id="desc">A simple loop showing objective, checkpoint, validation, progress log, and stopping condition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .label { font: 700 23px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .body { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #334155; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 24; ry: 24; }
      .accent { fill: #eef2ff; stroke: #818cf8; }
      .green { fill: #ecfdf5; stroke: #34d399; }
      .amber { fill: #fffbeb; stroke: #f59e0b; }
      .slate { fill: #f8fafc; stroke: #94a3b8; }
      .pill { font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>

  <text x="80" y="78" class="title">/goal as a durable work loop</text>
  <text x="80" y="110" class="subtitle">One objective, one validation path, one verifiable stopping condition.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="190" width="260" height="150" class="card accent"/>
    <text x="110" y="236" class="label">1. Objective</text>
    <text x="110" y="270" class="body">State the outcome.</text>
    <text x="110" y="298" class="body">Keep the scope small</text>
    <text x="110" y="322" class="body">enough to finish.</text>

    <rect x="390" y="190" width="260" height="150" class="card slate"/>
    <text x="420" y="236" class="label">2. Checkpoint</text>
    <text x="420" y="270" class="body">Ask for progress in</text>
    <text x="420" y="298" class="body">small, trusted steps.</text>
    <text x="420" y="322" class="body">Inspect status regularly.</text>

    <rect x="700" y="190" width="260" height="150" class="card green"/>
    <text x="730" y="236" class="label">3. Validate</text>
    <text x="730" y="270" class="body">Use tests, artifacts,</text>
    <text x="730" y="298" class="body">or commands that prove</text>
    <text x="730" y="322" class="body">the work is moving.</text>

    <rect x="1010" y="190" width="260" height="150" class="card amber"/>
    <text x="1040" y="236" class="label">4. Stop</text>
    <text x="1040" y="270" class="body">Stop only when the</text>
    <text x="1040" y="298" class="body">verifiable end state</text>
    <text x="1040" y="322" class="body">has been reached.</text>
  </g>

  <line x1="340" y1="265" x2="390" y2="265" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="650" y1="265" x2="700" y2="265" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="960" y1="265" x2="1010" y2="265" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M1140 365 C1140 500, 260 500, 260 365" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="590" y="488" text-anchor="middle" class="pill">Repeat the loop until the goal is satisfied.</text>

  <g filter="url(#shadow)">
    <rect x="110" y="560" width="1180" height="120" class="card"/>
    <text x="150" y="608" class="label">Useful contract wording</text>
    <text x="150" y="642" class="body">Complete [objective] without stopping until [verifiable end state].</text>
    <text x="720" y="608" class="label">What the agent needs</text>
    <text x="720" y="642" class="body">Boundary • validation loop • progress checkpoints • stop condition</text>
  </g>
</svg>
