<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">When /goal fits and when it does not</title>
  <desc id="desc">A comparison card showing good-fit use cases and avoid cases for /goal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <style>
      .title { font: 700 34px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .h1 { font: 800 28px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .h2 { font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .body { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #334155; }
      .small { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #334155; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 28; ry: 28; }
      .good { fill: #ecfdf5; stroke: #10b981; }
      .bad { fill: #fff7ed; stroke: #f59e0b; }
      .muted { fill: #f8fafc; stroke: #cbd5e1; }
      .bulletGood { fill: #10b981; }
      .bulletBad { fill: #f59e0b; }
    </style>
  </defs>

  <rect width="1400" height="860" fill="url(#bg)"/>
  <text x="80" y="78" class="title">When /goal fits, and when it doesn’t</text>
  <text x="80" y="110" class="subtitle">The feature works best when there is a narrow target and a verifiable end state.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="160" width="610" height="610" class="card good"/>
    <rect x="710" y="160" width="610" height="610" class="card bad"/>
  </g>

  <text x="120" y="220" class="h1">Good fit</text>
  <text x="750" y="220" class="h1">Avoid</text>

  <g transform="translate(120,270)">
    <circle cx="12" cy="12" r="8" class="bulletGood"/>
    <text x="34" y="18" class="body">Code migrations with clear parity checks</text>

    <circle cx="12" cy="68" r="8" class="bulletGood"/>
    <text x="34" y="74" class="body">Large refactors with tests after each checkpoint</text>

    <circle cx="12" cy="124" r="8" class="bulletGood"/>
    <text x="34" y="130" class="body">Experiments or prototypes with a measurable target</text>

    <circle cx="12" cy="180" r="8" class="bulletGood"/>
    <text x="34" y="186" class="body">Prompt optimization against an eval suite</text>

    <circle cx="12" cy="260" r="8" class="bulletGood"/>
    <text x="34" y="266" class="body">Any task where progress can be inspected in checkpoints</text>
  </g>

  <g transform="translate(750,270)">
    <circle cx="12" cy="12" r="8" class="bulletBad"/>
    <text x="34" y="18" class="body">A loose backlog of unrelated work</text>

    <circle cx="12" cy="68" r="8" class="bulletBad"/>
    <text x="34" y="74" class="body">A goal that changes direction every few minutes</text>

    <circle cx="12" cy="124" r="8" class="bulletBad"/>
    <text x="34" y="130" class="body">Tasks with no validation loop or done definition</text>

    <circle cx="12" cy="180" r="8" class="bulletBad"/>
    <text x="34" y="186" class="body">High-risk work that still needs frequent human judgment</text>

    <circle cx="12" cy="260" r="8" class="bulletBad"/>
    <text x="34" y="266" class="body">Anything where “independent” would mean “unreviewed”</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="560" width="1160" height="150" class="card muted"/>
    <text x="160" y="612" class="h2">My rule of thumb</text>
    <text x="160" y="654" class="body">If I can name the objective, boundary, validation, and stopping condition in one paragraph, /goal is probably a good fit.</text>
    <text x="160" y="688" class="small">If I can’t, I should probably clarify the task first.</text>
  </g>
</svg>
