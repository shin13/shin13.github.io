<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent skills as a disciplined workflow</title>
  <desc id="desc">A calm diagram showing an idea moving through grill-me, to-prd, to-issues, tdd, and improve-codebase-architecture toward better agent-assisted software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 18px; fill: #475569; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
      .body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; fill: #475569; }
      .small { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; fill: #64748b; }
      .line { stroke: #64748b; stroke-width: 3; fill: none; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="620" rx="42" fill="url(#bg)"/>
  <circle cx="1010" cy="90" r="160" fill="#dbeafe" opacity="0.45"/>
  <circle cx="170" cy="520" r="150" fill="#ccfbf1" opacity="0.45"/>

  <text class="title" x="90" y="86">Agent skills turn taste into process</text>
  <text class="subtitle" x="90" y="122">Instead of asking a coding agent to “just build it,” give it a reusable path for thinking, slicing, testing, and improving.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="170" height="150" rx="26" fill="url(#card)" stroke="#e2e8f0"/>
    <text class="label" x="115" y="248">Idea</text>
    <text class="body" x="115" y="282">A feature, plan,</text>
    <text class="body" x="115" y="304">or system shape</text>
    <text class="small" x="115" y="326">still uncertain</text>
  </g>

  <path class="line" d="M258 275 H318"/>

  <g filter="url(#shadow)">
    <rect x="330" y="185" width="190" height="180" rx="28" fill="url(#card)" stroke="#e2e8f0"/>
    <text class="label" x="368" y="234">grill-me</text>
    <text class="body" x="368" y="270">Resolve the</text>
    <text class="body" x="368" y="292">design tree by</text>
    <text class="body" x="368" y="314">asking better</text>
    <text class="body" x="368" y="336">questions.</text>
  </g>

  <path class="line" d="M528 275 H588"/>

  <g filter="url(#shadow)">
    <rect x="600" y="185" width="190" height="180" rx="28" fill="url(#card)" stroke="#e2e8f0"/>
    <text class="label" x="645" y="234">to-prd</text>
    <text class="body" x="645" y="270">Turn shared</text>
    <text class="body" x="645" y="292">understanding</text>
    <text class="body" x="645" y="314">into user stories</text>
    <text class="body" x="645" y="336">and decisions.</text>
  </g>

  <path class="line" d="M798 275 H858"/>

  <g filter="url(#shadow)">
    <rect x="870" y="185" width="190" height="180" rx="28" fill="url(#card)" stroke="#e2e8f0"/>
    <text class="label" x="912" y="234">to-issues</text>
    <text class="body" x="912" y="270">Slice work into</text>
    <text class="body" x="912" y="292">vertical, testable</text>
    <text class="body" x="912" y="314">tracer bullets.</text>
  </g>

  <path class="line" d="M965 372 C965 430 760 430 760 430"/>

  <g filter="url(#shadow)">
    <rect x="510" y="410" width="230" height="135" rx="28" fill="url(#card)" stroke="#e2e8f0"/>
    <text class="label" x="560" y="459">tdd</text>
    <text class="body" x="560" y="494">Red → green → refactor,</text>
    <text class="body" x="560" y="516">one behavior at a time.</text>
  </g>

  <path class="line" d="M500 478 C410 478 410 360 500 360"/>

  <g filter="url(#shadow)">
    <rect x="110" y="408" width="300" height="140" rx="28" fill="url(#card)" stroke="#e2e8f0"/>
    <text class="label" x="145" y="456">improve architecture</text>
    <text class="body" x="145" y="491">Make modules deeper, interfaces</text>
    <text class="body" x="145" y="513">clearer, and codebases easier</text>
    <text class="body" x="145" y="535">for agents to reason about.</text>
  </g>

  <g>
    <rect x="820" y="430" width="250" height="78" rx="22" fill="#0f172a" opacity="0.92"/>
    <text x="852" y="463" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Better agent output</text>
    <text x="852" y="489" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#cbd5e1">from clearer process and systems</text>
  </g>
</svg>
